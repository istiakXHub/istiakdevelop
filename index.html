/* ---------------------------------------------------------------------- */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
html,body{ height:100%; }
body{
  background:var(--bg); color:var(--text);
  font-family:'Satoshi',system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.6; overflow-x:hidden;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
h1,h2,h3,h4,.font-display{ font-family:'Clash Display',system-ui,sans-serif; letter-spacing:-0.02em; }
a{ color:inherit; text-decoration:none; }
ul{ list-style:none; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
img{ max-width:100%; display:block; }
::selection{ background: rgba(var(--primary-rgb),.25); }

/* custom scrollbar */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--bg-secondary); }
::-webkit-scrollbar-thumb{ background:var(--accent-grad); border-radius:99px; border:2px solid var(--bg-secondary); }
html{ scrollbar-color: rgba(var(--primary-rgb),.6) var(--bg-secondary); scrollbar-width: thin; }

.container{ max-width:var(--container); margin:0 auto; padding:0 24px; }
.eyebrow{
  display:inline-block; font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--primary); margin-bottom:12px;
}
.section{ padding:110px 0; position:relative; }
.section-head{ text-align:center; max-width:640px; margin:0 auto 56px; }
.section-head h2{ font-size:clamp(30px,4vw,44px); font-weight:600; margin-bottom:14px; }
.section-head p{ color:var(--text-muted); font-size:16.5px; }

/* reveal-on-scroll */
.reveal{ opacity:0; transform: translateY(28px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.reveal.in{ opacity:1; transform:none; }
.grid .reveal:nth-child(1){ transition-delay:.03s; }
.grid .reveal:nth-child(2){ transition-delay:.09s; }
.grid .reveal:nth-child(3){ transition-delay:.15s; }
.grid .reveal:nth-child(4){ transition-delay:.21s; }
.grid .reveal:nth-child(5){ transition-delay:.27s; }
.grid .reveal:nth-child(6){ transition-delay:.33s; }
.grid .reveal:nth-child(7){ transition-delay:.39s; }
.grid .reveal:nth-child(8){ transition-delay:.45s; }
.grid .reveal:nth-child(9){ transition-delay:.51s; }
.grid .reveal:nth-child(10){ transition-delay:.57s; }
.grid .reveal:nth-child(n+11){ transition-delay:.6s; }
@media (prefers-reduced-motion: reduce){
  .reveal{ opacity:1; transform:none; transition:none; }
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}

/* =========================== LOADER =========================== */
#loader{
  position:fixed; inset:0; z-index:9999; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
  transition: opacity .6s var(--ease), visibility .6s var(--ease);
}
#loader.hide{ opacity:0; visibility:hidden; pointer-events:none; }
.loader-ring{ position:relative; width:88px; height:88px; display:flex; align-items:center; justify-content:center; }
.loader-ring::before{
  content:''; position:absolute; inset:0; border-radius:50%; padding:3px;
  background:var(--accent-grad); -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; animation: loader-spin 1.4s linear infinite;
}
@keyframes loader-spin{ to{ transform:rotate(360deg); } }
.loader-mark{
  width:64px;height:64px;border-radius:18px; background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center; color:#fff; font-family:'Clash Display';
  font-weight:600; font-size:24px; box-shadow:var(--shadow); animation: pulse-mark 1.6s ease-in-out infinite;
}
@keyframes pulse-mark{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
.loader-bar{ width:180px; height:3px; border-radius:3px; background:var(--bg-secondary); overflow:hidden; }
.loader-bar span{ display:block; height:100%; width:40%; background:var(--accent-grad); border-radius:3px; animation: loader-slide 1.1s ease-in-out infinite; }
@keyframes loader-slide{ 0%{ transform:translateX(-100%);} 100%{ transform:translateX(350%);} }

/* =========================== SCROLL PROGRESS =========================== */
#scroll-progress{ position:fixed; top:0; left:0; height:3px; width:0%; background:var(--accent-grad); z-index:1200; transition: width .1s linear; }

.photo-frame::before{
  content:''; position:absolute; inset:-16px; border-radius:50%;
  background: conic-gradient(from 0deg, #1e5fe0, #5bc8ff, #1e5fe0, #5bc8ff, #1e5fe0);
  z-index:0; opacity:.95;
  animation: ring-spin 7s linear infinite;
}
.photo-frame::after{
  content:''; position:absolute; inset:-40px; border-radius:50%;
  background: radial-gradient(circle, rgba(46,143,255,.55), rgba(46,143,255,.2) 55%, transparent 72%);
  z-index:-1; filter: blur(28px); animation: ring-pulse 3.2s ease-in-out infinite;
}
@keyframes ring-spin{ to{ transform: rotate(360deg); } }
@keyframes ring-spin-rev{ to{ transform: rotate(-360deg); } }
@keyframes ring-pulse{ 0%,100%{ opacity:.55; transform:scale(1); } 50%{ opacity:1; transform:scale(1.09); } }
@media (prefers-reduced-motion: reduce){ .photo-frame::before, .photo-frame::after, .ring-dashed, .ring-bg-dashed{ animation:none; } }
.photo-frame .ring-static{
  position:absolute; inset:-9px; border-radius:50%; z-index:1;
  border:3px solid rgba(255,255,255,.85); pointer-events:none;
}
.photo-frame .ring-dashed{
  position:absolute; inset:-27px; border-radius:50%; z-index:0; pointer-events:none;
  border:2px dashed rgba(46,143,255,.45);
  animation: ring-spin-rev 16s linear infinite;
}
.photo-frame .ring-bg-dashed{
  position:absolute; z-index:-2; pointer-events:none; border-radius:50%;
  top:50%; left:50%; width:170%; height:170%; transform:translate(-50%,-50%);
  border:1.5px dashed rgba(46,143,255,.22);
  animation: ring-spin 40s linear infinite;
}
.photo-frame img{
  position:relative; z-index:1; width:100%; height:100%; object-fit:cover; object-position:center 30%; border-radius:50%;
  box-shadow: var(--shadow); border:6px solid var(--bg);
  transition: transform var(--dur-slow) var(--ease);
}
.hero-visual:hover .photo-frame img{ transform:scale(1.03); }
.float-chip{
  position:absolute; z-index:2; display:flex; align-items:center; gap:6px; padding:8px 13px;
  border-radius:99px; background:var(--card-bg); backdrop-filter:blur(14px); border:1px solid var(--card-border);
  font-size:11.5px; font-weight:700; box-shadow:var(--shadow-soft); color:var(--primary); white-space:nowrap;
  animation: chip-float 5s ease-in-out infinite;
}
.chip-1{ top:10%; left:-10%; animation-delay:0s; }
.chip-2{ bottom:6%; right:-8%; animation-delay:1.6s; }
@keyframes chip-float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
@media (max-width:640px){
  .float-chip{ font-size:10px; padding:6px 10px; }
  .chip-1{ left:-2%; }
  .chip-2{ right:-2%; }
}

.contact-band{
  position:relative; border-radius:var(--radius-lg); padding:52px; overflow:hidden;
  background:var(--card-bg); backdrop-filter:blur(18px); border:1px solid var(--card-border); box-shadow:var(--shadow-soft);
}
.contact-band::before{
  content:''; position:absolute; inset:0; border-radius:inherit; padding:1.5px;
  background:var(--accent-grad); -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
}
.contact-band-glow{
  position:absolute; width:280px;height:280px; border-radius:50%; background:var(--accent-grad);
  opacity:.18; filter:blur(60px); top:-100px; right:-60px; pointer-events:none;
}
.contact-band-head{ text-align:center; max-width:520px; margin:0 auto 36px; position:relative; }
.contact-band-head h2{ font-size:28px; font-weight:600; margin-bottom:10px; }
.contact-band-head p{ color:var(--text-muted); }
.contact-band-cards{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; position:relative; }
.contact-band-card{
  display:flex; align-items:center; gap:16px; padding:20px 22px; border-radius:var(--radius-md);
  background:var(--bg); border:1px solid var(--card-border); transition: all var(--dur) var(--ease);
  opacity:0; transform:translateY(16px); animation: cbc-in .6s var(--ease) forwards;
}
.contact-band-card:nth-child(1){ animation-delay:.05s; }
.contact-band-card:nth-child(2){ animation-delay:.16s; }
.contact-band-card:nth-child(3){ animation-delay:.27s; }
@keyframes cbc-in{ to{ opacity:1; transform:none; } }
.contact-band-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-soft); border-color:rgba(var(--primary-rgb),.35); }
.contact-band-card .ic{ width:48px;height:48px; border-radius:14px; background:var(--accent-grad); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition: transform var(--dur) var(--ease); }
.contact-band-card:hover .ic{ transform:scale(1.08) rotate(-4deg); }
.cbc-text{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
.cbc-label{ font-size:15.5px; font-weight:700; }
@media (max-width:700px){
  .contact-band{ padding:32px 22px; }
  .contact-band-cards{ grid-template-columns:1fr; }
  .contact-band-card{ flex-wrap:nowrap; flex-direction:column; text-align:center; gap:12px; padding:26px 20px; }
  .contact-band-card .btn{ width:100%; }
}

@media (max-width:900px){
  .hero-grid{ grid-template-columns:1fr; text-align:center; gap:40px; }
  .hero-copy p.intro{ margin-left:auto; margin-right:auto; }
  .hero-actions, .hero-stats{ justify-content:center; }
  .hero-visual{ order:-1; }
}

/* =========================== CARDS (glass) =========================== */
.glass-card{
  background:var(--card-bg); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--card-border); border-radius:var(--radius-md);
  box-shadow: var(--shadow-soft); transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.glass-card:hover{ transform: translateY(-6px); box-shadow: var(--shadow); border-color: rgba(var(--primary-rgb),.35); }

.grid{ display:grid; gap:24px; }
.grid-2{ grid-template-columns:repeat(2,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:980px){ .grid-3,.grid-4{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:640px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } }

/* about */
.about-card{ padding:30px; }
.about-card .ic{ width:46px;height:46px;border-radius:13px; background:var(--accent-grad); display:flex; align-items:center; justify-content:center; color:#fff; margin-bottom:16px; }
.about-card h3{ font-size:19px; font-weight:600; margin-bottom:8px; }
.about-card p{ color:var(--text-muted); font-size:15px; }
.reason-grid{ margin-top:70px; }
.reason-card{ padding:24px; text-align:center; }
.reason-card .ic{ width:44px;height:44px;border-radius:12px; background:rgba(var(--primary-rgb),.1); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.reason-card p{ font-weight:500; font-size:14.5px; }

/* services */
.service-card{ padding:28px; display:flex; flex-direction:column; gap:14px; position:relative; overflow:hidden; }
.service-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:3px 3px 0 0;
  background:var(--accent-grad); transform:scaleX(0); transform-origin:left; transition:transform .45s var(--ease);
}
.service-card:hover::before{ transform:scaleX(1); }
.service-card .svc-num{
  position:absolute; top:18px; right:20px; font-size:12.5px; font-weight:800; letter-spacing:.04em;
  color:var(--text-muted); opacity:.5;
}
.service-card .ic{
  width:50px;height:50px;border-radius:14px; background:var(--accent-grad); color:#fff;
  display:flex; align-items:center; justify-content:center;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  box-shadow: 0 6px 18px -6px rgba(var(--primary-rgb),.55);
}
.service-card:hover .ic{ transform:rotate(-8deg) scale(1.08); box-shadow: 0 10px 24px -6px rgba(var(--primary-rgb),.7); }
.service-card h3{ font-size:18.5px; font-weight:600; }
.service-card p.desc{ color:var(--text-muted); font-size:14.5px; flex:1; }

.cap-block{
  margin-top:64px; padding:44px 36px; border-radius:var(--radius-lg); position:relative; overflow:hidden;
  background:var(--card-bg); backdrop-filter:blur(18px); border:1px solid var(--card-border); box-shadow:var(--shadow-soft);
}
.cap-block::before{
  content:''; position:absolute; width:320px; height:320px; border-radius:50%; background:var(--accent-grad);
  opacity:.14; filter:blur(70px); top:-140px; left:-100px; pointer-events:none;
}
.cap-head{ text-align:center; max-width:560px; margin:0 auto 32px; position:relative; }
.cap-head h3{ font-size:23px; font-weight:600; margin-bottom:8px; }
.cap-head p{ color:var(--text-muted); font-size:14.5px; }
.cap-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; position:relative; }
@media (max-width:900px){ .cap-grid{ grid-template-columns:repeat(2,1fr); } .cap-block{ padding:36px 22px; } }
@media (max-width:520px){ .cap-grid{ grid-template-columns:1fr; } }
.cap-item{
  display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:14px;
  background:var(--bg); border:1px solid var(--card-border);
  transition: transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.cap-item:hover{ transform:translateY(-3px); border-color:rgba(var(--primary-rgb),.4); box-shadow:var(--shadow-soft); }
.cap-item .cap-ic{
  width:38px; height:38px; flex-shrink:0; border-radius:10px; background:var(--accent-grad); color:#fff;
  display:flex; align-items:center; justify-content:center;
}
.cap-item .cap-label{ font-size:14px; font-weight:600; line-height:1.3; }

/* ============ PROJECTS ============ */

  background:var(--card-bg); border:1px solid var(--card-border);

}
.project-card:hover{ transform:translateY(-8px); box-shadow:var(--shadow); }
.project-card .pc-accent{ height:5px; width:100%; }
.project-card .pc-img-wrap{ position:relative; width:100%; aspect-ratio:16/10; overflow:hidden; background:var(--bg-secondary); }
.project-card .pc-img-wrap img{ width:100%; height:100%; object-fit:cover; transition: transform .6s var(--ease); }
.project-card:hover .pc-img-wrap img{ transform:scale(1.06); }
.project-card .pc-img-wrap::after{
  content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55));
  opacity:0; transition:opacity var(--dur) var(--ease);
}
.project-card:hover .pc-img-wrap::after{ opacity:1; }
.project-card .pc-body{ padding:22px; }
.project-card h3{ font-size:16.5px; font-weight:700; margin-bottom:6px; }
.project-card p.pc-desc{ color:var(--text-muted); font-size:13.5px; margin-bottom:16px; line-height:1.5; }
.pc-details-btn{
  display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border-radius:99px;
  color:#fff; font-size:13px; font-weight:700; border:none; cursor:pointer;

.pc-details-btn:hover{ transform:translateX(3px); }
.pc-color-0{ background:linear-gradient(135deg,#2f6fed,#5bc8ff); }
.pc-color-1{ background:linear-gradient(135deg,#f2568e,#ff9776); }
.pc-color-2{ background:linear-gradient(135deg,#7c4dff,#c86dff); }
.pc-color-3{ background:linear-gradient(135deg,#0ea86c,#5ee0a4); }
.pc-color-4{ background:linear-gradient(135deg,#f2ab05,#ffcf5c); }

.projects-empty{ text-align:center; color:var(--text-muted); padding:40px 0; }
@media (max-width:640px){ .grid-2#projects-grid{ grid-template-columns:1fr; } }

.proj-modal-backdrop{
  position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,.65); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; padding:20px;
  opacity:0; pointer-events:none; transition: opacity .25s var(--ease);
}
.proj-modal-backdrop.open{ opacity:1; pointer-events:auto; }
.proj-modal{
  background:var(--bg); border-radius:var(--radius-lg); max-width:600px; width:100%; max-height:88vh; overflow-y:auto;
  position:relative; transform:scale(.94) translateY(10px); transition: transform .3s var(--ease); box-shadow:var(--shadow);
}
.proj-modal-backdrop.open .proj-modal{ transform:scale(1) translateY(0); }
.proj-modal-close{
  position:absolute; top:14px; right:14px; z-index:2; width:36px; height:36px; border-radius:50%;
  background:rgba(0,0,0,.5); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.proj-modal img{ width:100%; aspect-ratio:16/9; object-fit:cover; }
.proj-modal-body{ padding:26px 28px 30px; }
.proj-modal-body h3{ font-size:20px; font-weight:700; margin-bottom:12px; }
.proj-modal-body p{ color:var(--text-muted); font-size:14.5px; line-height:1.7; white-space:pre-line; }
.tech-pills{ display:flex; flex-wrap:wrap; gap:6px; }
.pill{ font-size:12px; padding:4px 10px; border-radius:99px; background:rgba(var(--primary-rgb),.08); color:var(--primary); font-weight:600; }
.service-foot{ display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px solid var(--card-border); }
.delivery-tag{ font-size:12.5px; color:var(--text-muted); }

.empty-state{
  text-align:center; padding:70px 30px; border-radius:var(--radius-lg); background:var(--card-bg);
  border:1px dashed rgba(var(--primary-rgb),.3);
}
.empty-state .ic{ width:60px;height:60px; border-radius:16px; background:rgba(var(--primary-rgb),.1); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
.empty-state h3{ font-size:20px; font-weight:600; margin-bottom:8px; }
.empty-state p{ color:var(--text-muted); max-width:420px; margin:0 auto; }

.skill-fill{ height:100%; width:0; background:var(--accent-grad); border-radius:99px; transition: width 1.3s var(--ease); position:relative; overflow:hidden; }
.skill-fill::after{
  content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-100%); animation: skill-shine 2.6s ease-in-out infinite;
}
@keyframes skill-shine{ 0%{ transform:translateX(-100%); } 60%,100%{ transform:translateX(220%); } }
.skill-card{ padding:22px; display:flex; flex-direction:column; gap:14px; }
.skill-card-top{ display:flex; align-items:center; gap:12px; }
.skill-card .ic{
  width:42px; height:42px; flex-shrink:0; border-radius:12px; background:var(--accent-grad); color:#fff;
  display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px -6px rgba(var(--primary-rgb),.55);
  transition: transform var(--dur) var(--ease);
}
.skill-card:hover .ic{ transform:rotate(-6deg) scale(1.08); }
.skill-card-name{ font-weight:700; font-size:15px; flex:1; }
.skill-card-pct{ font-weight:800; font-size:14px; color:var(--primary); }
.skill-track{ height:8px; border-radius:99px; background:var(--bg-secondary); overflow:hidden; }

/* achievements */
.ach-tabs{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:36px; }
.ach-tab{ padding:10px 20px; border-radius:99px; font-size:14px; font-weight:600; background:var(--card-bg); border:1px solid var(--card-border); }
.ach-tab.active{ background:var(--accent-grad); color:#fff; }
.ach-panel{ display:none; }
.ach-panel.active{ display:block; }

/* faq */
.accordion-item{ border-radius:var(--radius-sm); background:var(--card-bg); border:1px solid var(--card-border); margin-bottom:12px; overflow:hidden; }
.accordion-head{ display:flex; align-items:center; justify-content:space-between; padding:20px 24px; font-weight:600; font-size:15.5px; }
.accordion-head svg{ transition: transform var(--dur) var(--ease); flex-shrink:0; }
.accordion-item.open .accordion-head svg{ transform: rotate(180deg); }
.accordion-body{ max-height:0; overflow:hidden; transition: max-height var(--dur) var(--ease); }
.accordion-body-inner{ padding:0 24px 20px; color:var(--text-muted); font-size:14.5px; }

/* contact */
.contact-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; max-width:980px; margin:0 auto; }
.contact-card{
  padding:38px 28px; text-align:center; position:relative; overflow:hidden;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.contact-card:hover{ transform:translateY(-8px); box-shadow:var(--shadow); border-color:rgba(var(--primary-rgb),.4); }
.contact-card .ic-wrap{ position:relative; width:72px; height:72px; margin:0 auto 20px; }
.contact-card .ic-glow{
  position:absolute; inset:-14px; border-radius:50%; filter:blur(18px); opacity:.55;
  animation: cc-pulse 2.6s ease-in-out infinite;
}
@keyframes cc-pulse{ 0%,100%{ opacity:.4; transform:scale(1); } 50%{ opacity:.7; transform:scale(1.12); } }
.contact-card .ic{
  position:relative; width:72px; height:72px; border-radius:20px; color:#fff;
  display:flex; align-items:center; justify-content:center;
  transition: transform var(--dur) var(--ease);
  box-shadow:0 10px 24px -8px rgba(0,0,0,.35);
}
.contact-card:hover .ic{ transform:scale(1.07) rotate(-4deg); }
.contact-card h3{ font-size:18.5px; font-weight:700; margin-bottom:6px; }
.contact-hint{ color:var(--text-muted); font-size:13.5px; margin-bottom:22px; }
.contact-card .btn{ width:100%; justify-content:center; }
.cc-email .ic, .cc-email .ic-glow{ background:linear-gradient(135deg,#ea4335,#fbbc05); }
.cc-whatsapp .ic, .cc-whatsapp .ic-glow{ background:linear-gradient(135deg,#25d366,#128c7e); }
.cc-telegram .ic, .cc-telegram .ic-glow{ background:linear-gradient(135deg,#2aabee,#229ed9); }
@media (max-width:900px){ .contact-grid{ grid-template-columns:1fr; max-width:440px; } }

/* forms */
.form-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
.form-grid .full{ grid-column:1/-1; }
@media (max-width:700px){ .form-grid{ grid-template-columns:1fr; } }
.field{ position:relative; }
.field label{ display:block; font-size:13.5px; font-weight:600; margin-bottom:8px; }
.field input, .field select, .field textarea{
  width:100%; padding:14px 16px; border-radius:14px; background:var(--bg-secondary); border:1.5px solid var(--card-border);

.field input:focus, .field select:focus, .field textarea:focus{

.field .err{ color:var(--secondary); font-size:12.5px; margin-top:6px; display:none; }
.field.invalid input, .field.invalid select, .field.invalid textarea{ border-color:var(--secondary); }
.field.invalid .err{ display:block; }
.checkbox-field{ display:flex; align-items:flex-start; gap:10px; font-size:13.5px; color:var(--text-muted); }
.checkbox-field input{ width:18px; height:18px; accent-color:var(--primary); margin-top:2px; }
.field-agree.invalid{ color:var(--secondary); }
.field-agree.invalid label{ color:var(--secondary); }

.order-tabs{
  display:flex; gap:8px; justify-content:center; max-width:420px; margin:0 auto 34px;
  background:var(--bg-secondary); border:1px solid var(--card-border); border-radius:16px; padding:6px;
}
.order-tab{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 14px; border-radius:12px; font-size:13.5px; font-weight:700; color:var(--text-muted);
  background:transparent; border:none; cursor:pointer; transition: all var(--dur-fast) var(--ease);
}
.order-tab.active{ background:var(--card-bg); color:var(--primary); box-shadow:var(--shadow-soft); }
.order-tab:hover:not(.active){ color:var(--text); }
.order-panel-track{ margin-bottom:20px; }
.order-form-wrap{
  max-width:880px; margin:0 auto; padding:44px; position:relative; border-radius:var(--radius-lg);
  background:var(--bg); border:1px solid var(--card-border); box-shadow:var(--shadow-soft);
}
.order-form-wrap::before{
  content:''; position:absolute; inset:0; border-radius:inherit; padding:1.5px;
  background:var(--accent-grad); -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; opacity:.6;
}
.of-group{ margin-bottom:32px; }
.of-group:last-of-type{ margin-bottom:24px; }
.of-group-head{
  display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:var(--primary);
  margin-bottom:18px; padding-bottom:10px; border-bottom:1px solid var(--card-border);
  text-transform:uppercase; letter-spacing:.06em;
}
.success-panel{ text-align:center; padding:60px 20px; }
.success-panel .ic{ width:70px;height:70px; border-radius:50%; background:var(--accent-grad); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; animation: pop .5s var(--ease); }
@keyframes pop{ 0%{ transform:scale(0); } 70%{ transform:scale(1.1); } 100%{ transform:scale(1); } }

  background:var(--text); color:var(--bg); padding:12px 22px; border-radius:99px; font-size:13.5px; font-weight:600;

<script type="module">
/**
 * firebase-sync.js
 * -----------------------------------------------------------------------
 * Loads live content from Firestore (saved by admin.html) and merges it
 * on top of the default window.PORTFOLIO_DATA above, BEFORE app.js reads
 * it. This is a type="module" script, so the browser waits for it to
 * finish before firing DOMContentLoaded — app.js (below) always sees the
 * final, merged data. If Firestore is slow/offline, we time out after 4s
 * and just keep the defaults above, so the site never breaks.
 * -----------------------------------------------------------------------
 */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
// getDoc/doc above are reused (no separate import needed) for single-order lookups.

const firebaseConfig = {
  apiKey: "AIzaSyArwonmWdlqRnAEIe0Z6g4ozeuZcU6YtH0",
  authDomain: "istiak-agency-27bc4.firebaseapp.com",
  projectId: "istiak-agency-27bc4",
  storageBucket: "istiak-agency-27bc4.firebasestorage.app",
  messagingSenderId: "1079978869832",
  appId: "1:1079978869832:web:f5005a48986453fc7e047d"
};
const __istiakApp = initializeApp(firebaseConfig);
const __istiakDb = getFirestore(__istiakApp);

// Exposed so app.js (a classic, non-module script) can save an order to
// Firestore when the Order form is submitted. Admin panel reads this
// "orders" collection so every submission shows up there instantly.
// Returns the new order's document ID (used as the customer's tracking
// code) on success, or null if the save failed.
window.__istiakSaveOrder = async function (orderFields) {
  try {
    const ref = await addDoc(collection(__istiakDb, "orders"), { ...orderFields, submittedAt: serverTimestamp(), status: "new" });
    return ref.id;
  } catch (err) {
    console.warn("Could not save order to Firestore:", err);
    return null;
  }
};

// Exposed so the public "Track Order" page can look up a single order by
// its ID. Firestore security rules allow anyone to GET one order doc by
// exact ID, but never to LIST/browse the whole collection — so this only
// works if the visitor already has their own order ID.
window.__istiakGetOrder = async function (orderId) {
  try {
    const snap = await getDoc(doc(__istiakDb, "orders", orderId.trim()));
    return snap.exists() ? { id: snap.id, ...snap.data() } : null;
  } catch (err) {
    console.warn("Could not fetch order:", err);
    return null;
  }
};

function deepMerge(target, source) {
  for (const key in source) {
    const sv = source[key];
    if (sv && typeof sv === "object" && !Array.isArray(sv) &&
        target[key] && typeof target[key] === "object" && !Array.isArray(target[key])) {
      deepMerge(target[key], sv);
    } else if (sv !== undefined) {
      target[key] = sv;
    }
  }
  return target;
}

async function loadLiveData() {
  try {
    const ref = doc(__istiakDb, "site", "data");
    const timeout = new Promise((resolve) => setTimeout(() => resolve(null), 4000));
    const snap = await Promise.race([getDoc(ref), timeout]);
    if (snap && snap.exists && snap.exists()) {
      deepMerge(window.PORTFOLIO_DATA, snap.data());
    }
  } catch (err) {
    console.warn("Live content load skipped, using built-in defaults:", err);
  }
}
window.__istiakLiveDataReady = loadLiveData();
await window.__istiakLiveDataReady;
</script>

    const el = document.getElementById("hero-role-text");
    let ri = 0, ci = 0, deleting = false;
    function tick(){
      const word = roles[ri];
      el.textContent = deleting ? word.slice(0, ci--) : word.slice(0, ci++);
      let delay = deleting ? 40 : 80;
      if (!deleting && ci === word.length + 1){ deleting = true; delay = 1400; }
      else if (deleting && ci < 0){ deleting = false; ri = (ri+1) % roles.length; ci = 0; delay = 300; }
      typingTimer = setTimeout(tick, delay);
    }
    tick();
  }

  function animateCounters(force){
    document.querySelectorAll("[data-count]").forEach(el => {
      if (el.dataset.done && !force) return;
      const target = parseInt(el.dataset.count, 10) || 0;
      let cur = 0;
      const step = Math.max(1, Math.ceil(target / 40));
      el.dataset.done = "1";
      const iv = setInterval(() => {
        cur += step;
        if (cur >= target){ cur = target; clearInterval(iv); }
        el.textContent = cur;
      }, 30);
    });
  }

  function observeSkillBars(){
    const bars = document.querySelectorAll(".skill-fill:not([data-observed])");
    bars.forEach(bar => {
      bar.setAttribute("data-observed", "1");
      const io = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if (en.isIntersecting){
            bar.style.width = bar.dataset.level + "%";
            io.unobserve(bar);
          }
        });
      }, { threshold:0.3 });
      io.observe(bar);
    });
  }

  /* ---------------------------------------------------------------- EVENTS */
  function bindGlobalEvents(){
    document.body.addEventListener("click", (e) => {
      // navigation
      const navLink = e.target.closest("[data-page], a[href^='#']");
      if (navLink){
        const href = navLink.getAttribute("href") || "";
        const page = navLink.dataset.page || href.replace("#","");
        if (["home","about","services","achievements","contact","order","faq","settings"].includes(page)){
          e.preventDefault();
          routeTo(page);
        }
      }
      // ripple
      const btn = e.target.closest(".btn");
      if (btn){
        const ripple = document.createElement("span");
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.className = "ripple";
        ripple.style.width = ripple.style.height = size + "px";
        ripple.style.left = (e.clientX - rect.left - size/2) + "px";
        ripple.style.top = (e.clientY - rect.top - size/2) + "px";
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 650);
        playSound();
      }
      // mobile menu toggle
      if (e.target.closest("#mobile-toggle")){
        document.getElementById("nav-links").classList.toggle("open");
      }
      // theme swatch
      const sw = e.target.closest(".swatch");
      if (sw) applyTheme(sw.dataset.theme);
      // lang toggle
      const lb = e.target.closest("[data-lang]");
      if (lb) setLang(lb.dataset.lang);
      // sound toggle
      const sb = e.target.closest("[data-sound]");
      if (sb){ state.sound = sb.dataset.sound === "on"; localStorage.setItem("ist_sound", sb.dataset.sound); renderSettings(); }
      // achievements tab
      const at = e.target.closest("[data-ach]");
      if (at){ state.achTab = at.dataset.ach; renderAchievements(); }
      // accordion
      const head = e.target.closest(".accordion-head");
      if (head){
        const item = head.closest(".accordion-item");
        const body = item.querySelector(".accordion-body");
        const wasOpen = item.classList.contains("open");
        document.querySelectorAll(".accordion-item.open").forEach(o => { o.classList.remove("open"); o.querySelector(".accordion-body").style.maxHeight = null; });
        if (!wasOpen){ item.classList.add("open"); body.style.maxHeight = body.scrollHeight + "px"; }
      }
      // back to top
      if (e.target.closest("#back-to-top")) window.scrollTo({ top:0, behavior:"smooth" });
    });

    document.getElementById("order-form").addEventListener("submit", onOrderSubmit);
    document.getElementById("f-country").addEventListener("change", updateOrderBudgetOptions);
    document.getElementById("f-contactMethod").addEventListener("change", updateOrderContactLabel);
    document.getElementById("tab-new-order").addEventListener("click", () => setOrderTab("form"));
    document.getElementById("tab-track-order").addEventListener("click", () => setOrderTab("track"));
    document.getElementById("track-btn").addEventListener("click", checkOrderStatus);
    document.getElementById("track-input").addEventListener("keydown", (e) => { if (e.key === "Enter"){ e.preventDefault(); checkOrderStatus(); } });
    document.getElementById("oid-copy").addEventListener("click", async () => {
      const idText = document.getElementById("success-order-id-value").textContent;
      try{
        await navigator.clipboard.writeText(idText);
        showToast(t().order.copied, "check");
      }catch(err){ /* clipboard may be unavailable — ignore */ }
    });
    window.addEventListener("hashchange", () => routeTo(location.hash.replace("#","")));
    window.addEventListener("scroll", onScroll, { passive:true });
  }

  let audioCtx = null;
  function playSound(){
    if (!state.sound) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 720;
      g.gain.setValueAtTime(0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.15);
    }catch(err){}
  }

  /* ---------------------------------------------------------------- ORDER FORM */
  async function onOrderSubmit(e){
    e.preventDefault();
    // Spam/bot protection: a hidden field only a bot would fill, and a
    // minimum time-on-form check (a real person can't fill this whole
    // form in under a few seconds). Fails silently — no error shown, no
    // save happens — so bots get no feedback to adapt to.
    const honeypot = document.getElementById("f-hp-website");
    if ((honeypot && honeypot.value.trim()) || (Date.now() - orderFormShownAt < 3000)){
      return;
    }
    const T = t().order;
    const required = ["fullName","email","country","contactMethod","contactValue","category","projectTitle","description","budget","deadline"];
    let valid = true;
    required.forEach(name => {
      const input = document.getElementById("f-" + name);
      const field = input.closest(".field");
      const ok = input.value.trim().length > 0;
      field.classList.toggle("invalid", !ok);
      if (!ok) valid = false;
    });
    const agree = document.getElementById("f-agree");
    agree.closest(".field-agree").classList.toggle("invalid", !agree.checked);
    if (!agree.checked) valid = false;
    if (!valid){
      showToast(t().toast.missingFields, "alert-circle");
      const firstInvalid = document.querySelector("#order-form .field.invalid, #order-form .field-agree.invalid");
      if (firstInvalid) firstInvalid.scrollIntoView({ behavior:"smooth", block:"center" });
      return;
    }

    const val = id => (document.getElementById(id)?.value || "").trim();
    const fields = {
      "Client Name": val("f-fullName"), "Email": val("f-email"), "Country": val("f-country"),
      "Preferred Contact": `${val("f-contactMethod")} — ${val("f-contactValue")}`, "Requested Service": val("f-category"),
      "Budget": val("f-budget"), "Deadline": val("f-deadline"), "Project Title": val("f-projectTitle"),
      "Project Description": val("f-description"), "Reference Link": val("f-reference"),
      "Additional Notes": val("f-notes")
    };
    const body = [
      "━━━━━━━━━━━━━━━━━━━━━━","NEW CLIENT ORDER","━━━━━━━━━━━━━━━━━━━━━━",
      ...Object.entries(fields).map(([k,v]) => `${k}: ${v}`),
      "━━━━━━━━━━━━━━━━━━━━━━", "Submitted From Portfolio Website", "━━━━━━━━━━━━━━━━━━━━━━"
    ].join("\n");
    const mailtoLink = `mailto:${D.profile.email}?subject=${encodeURIComponent("New Client Order — " + val("f-projectTitle"))}&body=${encodeURIComponent(body)}`;

    const submitBtn = document.getElementById("order-submit");
    let silentlySent = false;
    let orderId = null;

    // Save to Firestore (so the order shows up in the Admin Panel) and email
    // it via Formspree AT THE SAME TIME — these don't depend on each other,
    // so there's no reason to wait for one before starting the other. Doing
    // them in parallel roughly halves how long the person waits.
    const origBtnHTML = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="btn-spinner"></span> ${t().order.submit}`;

    const saveOrderPromise = window.__istiakSaveOrder
      ? window.__istiakSaveOrder(fields).catch(() => null)
      : Promise.resolve(null);

    const emailPromise = (D.formspreeEndpoint && D.formspreeEndpoint.trim())
      ? fetch(D.formspreeEndpoint, {
          method: "POST",
          headers: { "Accept": "application/json", "Content-Type": "application/json" },
          body: JSON.stringify({ ...fields, _subject: "New Client Order — " + val("f-projectTitle") })
        }).then(res => res.ok).catch(() => false)
      : Promise.resolve(false);

    [orderId, silentlySent] = await Promise.all([saveOrderPromise, emailPromise]);

    submitBtn.disabled = false;
    submitBtn.innerHTML = origBtnHTML;

    document.getElementById("order-form").style.display = "none";
    const successPanel = document.getElementById("order-success");
    successPanel.style.display = "block";
    const sendBtn = document.getElementById("success-send-email");
    if (silentlySent){
      sendBtn.style.display = "none";
      showToast(t().toast.sent, "check-circle");
    } else {
      sendBtn.style.display = "inline-flex";
      sendBtn.href = mailtoLink;
      sendBtn.innerHTML = `<i data-lucide="mail" style="width:16px;height:16px"></i> ${t().contact.emailBtn}`;
      showToast(t().toast.formReady, "mail-check");
      try{ sendBtn.click(); }catch(err){ /* fine — the visible button below still works */ }
    }

    const trackBox = document.getElementById("success-order-id");
    if (orderId){
      trackBox.style.display = "block";
      document.getElementById("success-order-id-value").textContent = orderId;
      document.getElementById("oid-track-link").onclick = () => {
        document.getElementById("track-input").value = orderId;
        setOrderTab("track");
        checkOrderStatus();
      };
    } else {
      trackBox.style.display = "none";
    }

    successPanel.scrollIntoView({ behavior:"smooth", block:"start" });
    window.lucide && window.lucide.createIcons();
  }

  /* ---------------------------------------------------------------- SCROLL FX */
  function onScroll(){
    const nav = document.getElementById("navbar");
    nav.classList.toggle("scrolled", window.scrollY > 30);
    const doc = document.documentElement;
    const pct = (doc.scrollTop) / (doc.scrollHeight - doc.clientHeight) * 100;
    document.getElementById("scroll-progress").style.width = (pct || 0) + "%";
    document.getElementById("back-to-top").classList.toggle("show", window.scrollY > 500);
  }

  function initScrollFx(){
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => { if (en.isIntersecting) en.target.classList.add("in"); });
    }, { threshold:0.15 });
    const observeAll = () => document.querySelectorAll(".reveal:not(.in)").forEach(el => io.observe(el));
    observeAll();
    const mo = new MutationObserver(observeAll);
    mo.observe(document.body, { childList:true, subtree:true });
  }

  /* ---------------------------------------------------------------- HERO PARALLAX */
  function initHeroParallax(){
    if (window.matchMedia("(hover: none)").matches) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const heroEl = document.querySelector(".hero");
    const blobs = document.querySelectorAll(".hero .blob");
    if (!heroEl || !blobs.length) return;
    heroEl.addEventListener("mousemove", (e) => {
      const rect = heroEl.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      blobs.forEach((b, i) => {
        const strength = (i + 1) * 14;
        b.style.animationPlayState = "paused";
        b.style.transform = `translate(${px*strength}px, ${py*strength}px)`;
      });
    });
    heroEl.addEventListener("mouseleave", () => {
      blobs.forEach(b => { b.style.transform = ""; b.style.animationPlayState = "running"; });
    });
  }

  /* ---------------------------------------------------------------- CURSOR */
  function initCursor(){
    if (window.matchMedia("(hover: none)").matches) return;
    const dot = document.createElement("div"); dot.className = "cursor-dot";
    const ring = document.createElement("div"); ring.className = "cursor-ring";
    document.body.append(dot, ring);
    let rx=0, ry=0;
    window.addEventListener("mousemove", (e) => {
      dot.style.left = e.clientX + "px"; dot.style.top = e.clientY + "px";
      rx = e.clientX; ry = e.clientY;
    });
    (function loop(){
      ring.style.left = rx + "px"; ring.style.top = ry + "px";
      requestAnimationFrame(loop);
    })();
    document.body.addEventListener("mouseover", (e) => {
      ring.classList.toggle("hover", !!e.target.closest("a,button,.glass-card,.swatch"));
    });
  }

})();

</script>
</body>
</html>
